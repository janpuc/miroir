---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Stale

on:
  schedule:
    - cron: 30 1 * * *
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    name: Stale
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      # This runs on the org's bot app, which a fork cannot reach. Skip
      # rather than fail nightly: triage is the upstream repo's job, and a
      # red cron in every fork only hides its real failures. `secrets` is
      # not available to a step `if`, so check it into an output first.
      - name: Look for the bot app
        id: bot
        env:
          BOT_CLIENT_ID: ${{ secrets.BOT_CLIENT_ID }}
        run: |
          if [ -n "${BOT_CLIENT_ID}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no bot app configured; skipping stale triage"
          fi

      - name: Generate Token
        if: ${{ steps.bot.outputs.present == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: "${{ secrets.BOT_CLIENT_ID }}"
          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"
          permission-issues: write
          permission-pull-requests: write

      - name: Stale
        if: ${{ steps.bot.outputs.present == 'true' }}
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          repo-token: ${{ steps.app-token.outputs.token }}
          stale-issue-message: |
            This issue has been marked as stale due to 60 days of inactivity. Please remove the stale label or leave a comment to keep it open.
            If no action is taken, it will be automatically closed in 7 days.
          stale-pr-message: |
            This pull request has been marked as stale due to 60 days of inactivity. Please remove the stale label or leave a comment to keep it open.
            If no action is taken, it will be automatically closed in 7 days.
          close-issue-message: |
            This issue has been automatically closed after 7 days of inactivity following the stale status.
          close-pr-message: |
            This pull request has been automatically closed after 7 days of inactivity following the stale status.
          stale-issue-label: stale
          stale-pr-label: stale
          delete-branch: true
